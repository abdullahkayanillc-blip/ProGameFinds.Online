name: ProGameFinds preview browser QA
on:
  push:
    branches:
      - progamefinds-professional-qa-2026-11-19
      - release/progamefinds-professional-2026-11-20
      - main
  pull_request:
    branches:
      - progamefinds-professional-upgrade-2026-11-19
      - main
permissions:
  contents: read
jobs:
  browser-smoke:
    name: Chromium desktop and mobile smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test deployed preview
        env:
          PREVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PREVIEW_SLUG=$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28 | sed 's/-*$//')
            PREVIEW_URL="https://${PREVIEW_SLUG}.progamefinds-online.pages.dev"
          else
            PREVIEW_URL="https://progamefinds.online"
          fi
          PREVIEW_URL="$PREVIEW_URL" node scripts/browser-smoke.mjs
