name: Site compliance checks
on:
  push:
    branches: [main, amazon-compliance-professional-setup]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate affiliate links, disclosures, SEO and guides
        run: node scripts/validate-site.mjs
