<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">ProGameFinds premium PGF gaming mark</title>
<desc id="desc">A metallic PGF monogram with a gamepad control detail and electric blue cyan violet accents.</desc>
<defs>
 <linearGradient id="frame" x1="10" y1="8" x2="118" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#39E5F4"/><stop offset=".48" stop-color="#327CFF"/><stop offset="1" stop-color="#B65CFF"/></linearGradient>
 <linearGradient id="metal" x1="24" y1="20" x2="105" y2="108" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".48" stop-color="#C8D8EA"/><stop offset="1" stop-color="#6D91B9"/></linearGradient>
 <linearGradient id="blue" x1="38" y1="24" x2="106" y2="106" gradientUnits="userSpaceOnUse"><stop stop-color="#42E8F4"/><stop offset=".55" stop-color="#188DFF"/><stop offset="1" stop-color="#6B4DFF"/></linearGradient>
 <linearGradient id="bg" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#142B4B"/><stop offset="1" stop-color="#050B17"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="4" y="4" width="120" height="120" rx="31" fill="#030814"/>
