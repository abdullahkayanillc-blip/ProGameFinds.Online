<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">ProGameFinds crowned PGF gaming emblem</title>
<desc id="desc">A premium chrome PGF monogram with crown and controller-inspired controls, framed by electric cyan, blue and violet light.</desc>
<defs>
 <linearGradient id="frame" x1="20" y1="12" x2="232" y2="244" gradientUnits="userSpaceOnUse"><stop stop-color="#7DF7FF"/><stop offset=".42" stop-color="#268BFF"/><stop offset="1" stop-color="#B65CFF"/></linearGradient>
 <linearGradient id="chrome" x1="55" y1="55" x2="198" y2="204" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF"/><stop offset=".25" stop-color="#DCEBFF"/><stop offset=".52" stop-color="#7896BC"/><stop offset=".72" stop-color="#F8FCFF"/><stop offset="1" stop-color="#8CA8CE"/></linearGradient>
 <linearGradient id="neon" x1="80" y1="35" x2="220" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#42F3FF"/><stop offset=".5" stop-color="#267DFF"/><stop offset="1" stop-color="#B44EFF"/></linearGradient>
 <radialGradient id="bg" cx="25%" cy="10%" r="95%"><stop stop-color="#18365D"/><stop offset=".55" stop-color="#09172C"/><stop offset="1" stop-color="#030814"/></radialGradient>
